<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ================= BASIC ================= -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#050508"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- ================= PRIMARY SEO ================= -->

    <title>
      Vaytrix Tech IT | Technology, Talent & Digital Solutions
    </title>

    <meta
      name="description"
      content="Vaytrix Tech IT delivers technology solutions, software development, IT staffing, professional training, career opportunities, consulting, and digital solutions for modern businesses."
    />

    <meta
      name="author"
      content="Vaytrix Tech IT"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- ================= CANONICAL ================= -->

    <link
      rel="canonical"
      href="https://vaytrixtechit.com/"
    />

    <!-- ================= FAVICON ================= -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- ================= WEB APP ================= -->

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Vaytrix"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- ================= OPEN GRAPH / FACEBOOK / LINKEDIN ================= -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Vaytrix Tech IT"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:title"
      content="Vaytrix Tech IT | Technology, Talent & Digital Solutions"
    />

    <meta
      property="og:description"
      content="Building smarter digital solutions through technology, software development, IT staffing, training, consulting, and career solutions."
    />

    <meta
      property="og:url"
      content="https://vaytrixtechit.com/"
    />

    <meta
      property="og:image"
      content="https://vaytrixtechit.com/favicon.png"
    />

    <meta
      property="og:image:alt"
      content="Vaytrix Tech IT"
    />

    <!-- ================= TWITTER / X ================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Vaytrix Tech IT | Technology & Digital Solutions"
    />

    <meta
      name="twitter:description"
      content="Technology, software development, IT staffing, professional training, consulting, and career solutions for a smarter digital future."
    />

    <meta
      name="twitter:image"
      content="https://vaytrixtechit.com/favicon.png"
    />

    <meta
      name="twitter:image:alt"
      content="Vaytrix Tech IT"
    />

    <!-- ================= STRUCTURED DATA ================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vaytrix Tech IT",
        "url": "https://vaytrixtechit.com/",
        "logo": "https://vaytrixtechit.com/favicon.png",
        "description": "Vaytrix Tech IT delivers technology solutions, software development, IT staffing, professional training, consulting, career opportunities, and digital solutions.",
        "sameAs": []
      }
    </script>

    <!-- ================= PERFORMANCE ================= -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
